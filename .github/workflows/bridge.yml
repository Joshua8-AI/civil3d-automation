name: bridge

on:
  push:
    paths:
      - "bridge/**"
      - ".github/workflows/bridge.yml"
  pull_request:
    paths:
      - "bridge/**"
      - ".github/workflows/bridge.yml"

jobs:
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
